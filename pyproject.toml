[project]
name = "kyrgstudio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.43.72",
    "celery[redis]>=5.6.0,<6",
    "elevenlabs>=2.49.0",
    "fastapi>=0.139.0",
    "faster-whisper>=1.2.1",
    "google-auth>=2.53.0",
    "google-genai>=2.7.0",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "loguru>=0.7.3",
    "openai>=2.38.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "runwayml>=4.15.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "weasyprint>=69.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyrg", "src/cli"]

[project.scripts]
kyrg = "cli.main:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
markers = [
    "live_eval: executes paid, non-deterministic LLM quality evaluations",
]
