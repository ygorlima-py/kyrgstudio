name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Validate CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff
        run: uv run ruff check src/cli tests/unit/cli

      - name: Check formatting
        run: uv run ruff format --check src/cli tests/unit/cli

      - name: Run Pyright
        run: uv run pyright src/cli

      - name: Run CLI unit tests
        run: uv run pytest -q tests/unit/cli

      - name: Build package
        run: uv build

  backend:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Run Pyright
        run: uv run pyright src/app

      - name: Run backend unit tests
        run: uv run pytest -q tests/unit/app tests/unit/kyrg

  frontend:
    name: Validate frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  docker:
    name: Validate Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp env_example .env

      - name: Validate Compose
        run: docker compose --env-file .env config --quiet

      - name: Build images
        run: docker compose --env-file .env build
