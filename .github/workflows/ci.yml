name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Validate CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff
        run: uv run ruff check src/cli tests/unit/cli

      - name: Check formatting
        run: uv run ruff format --check src/cli tests/unit/cli

      - name: Run Pyright
        run: uv run pyright src/cli

      - name: Run CLI unit tests
        run: uv run pytest -q tests/unit/cli

      - name: Build package
        run: uv build
