name: kyrgstudio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kyrgstudio}
      POSTGRES_USER: ${POSTGRES_USER:-kyrgstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyrgstudio_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kyrgstudio} -d ${POSTGRES_DB:-kyrgstudio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kyrgstudio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kyrgstudio_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 90s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: kyrgstudio-backend:local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kyrgstudio}:${POSTGRES_PASSWORD:-kyrgstudio_dev}@postgres:5432/${POSTGRES_DB:-kyrgstudio}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kyrgstudio-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kyrgstudio}:${POSTGRES_PASSWORD:-kyrgstudio_dev}@postgres:5432/${POSTGRES_DB:-kyrgstudio}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-kyrgstudio}:${RABBITMQ_PASSWORD:-kyrgstudio_dev}@rabbitmq:5672//
      APP_STORAGE_DIR: /app/.storage
      APP_API_CORS_ORIGINS: ${APP_API_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - app_storage:/app/.storage
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: kyrgstudio-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kyrgstudio}:${POSTGRES_PASSWORD:-kyrgstudio_dev}@postgres:5432/${POSTGRES_DB:-kyrgstudio}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-kyrgstudio}:${RABBITMQ_PASSWORD:-kyrgstudio_dev}@rabbitmq:5672//
      APP_STORAGE_DIR: /app/.storage
    volumes:
      - app_storage:/app/.storage
      - model_cache:/root/.cache
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /v1
        VITE_AUTH_CSRF_COOKIE_NAME: kyrg_csrf_token
        VITE_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-2147483648}
        VITE_ACCEPTED_MEDIA_TYPES: ${APP_ACCEPTED_INPUT_MEDIA_TYPES:-video/mp4,video/quicktime,video/webm,video/x-msvideo,audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/x-wav,audio/webm}
    image: kyrgstudio-frontend:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
      NGINX_MAX_REQUEST_BODY_SIZE: ${NGINX_MAX_REQUEST_BODY_SIZE:-2100m}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  app_storage:
  model_cache:
